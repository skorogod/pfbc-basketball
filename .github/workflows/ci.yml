name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pfbc
          POSTGRES_PASSWORD: pfbc
          POSTGRES_DB: pfbc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pfbc" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://pfbc:pfbc@localhost:5432/pfbc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # точные версии — те же, что в образе (плюс инструменты разработки)
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q
      - run: docker build -t pfbc-bot:ci .
