[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pfbc-bot"
version = "0.1.0"
description = "Telegram-бот для администрирования процессов баскетбольного клуба PFBC"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10,<4",
    "structlog>=24.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-tools>=7.4",  # pip-compile: requirements.lock / requirements-dev.lock
]

[tool.hatch.build.targets.wheel]
packages = ["src/pfbc_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["pfbc_bot"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: тесты с реальным PostgreSQL (нужен Docker)"]
